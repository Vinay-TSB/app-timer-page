<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="App Redirect Timer - Opening your app in 30 seconds">
    <title>Opening App...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .timer-circle {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 30px auto;
        }

        .timer-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            z-index: 2;
        }

        .progress-ring {
            transform: rotate(-90deg);
        }

        .progress-ring-circle {
            stroke: #667eea;
            stroke-width: 8;
            fill: transparent;
            transition: stroke-dashoffset 1s linear;
        }

        .progress-ring-bg {
            stroke: #e0e0e0;
            stroke-width: 8;
            fill: transparent;
        }

        .status-text {
            color: #888;
            font-size: 14px;
            margin-top: 20px;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .manual-button {
            display: none;
            margin-top: 30px;
            padding: 16px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .manual-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .manual-button:active {
            transform: translateY(0);
        }

        .config-info {
            margin-top: 30px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            font-size: 12px;
            color: #666;
            border-left: 4px solid #667eea;
        }

        .config-info strong {
            color: #333;
            display: block;
            margin-bottom: 5px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .timer-circle {
                width: 150px;
                height: 150px;
            }

            .timer-display {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📱</div>
        <h1>Opening Your App</h1>
        <p class="subtitle">Please wait while we redirect you...</p>
        
        <div class="timer-circle">
            <svg width="180" height="180">
                <circle class="progress-ring-bg" cx="90" cy="90" r="80"></circle>
                <circle class="progress-ring-circle" cx="90" cy="90" r="80" id="progressCircle"></circle>
            </svg>
            <div class="timer-display" id="countdown">30</div>
        </div>
        
        <p class="status-text" id="statusText">Redirecting in <span id="statusSeconds">30</span> seconds...</p>
        
        <!-- Hidden link for automatic redirect -->
        <a href="" id="autoRedirectLink" style="display: none;"></a>
        
        <button class="manual-button" id="manualButton" onclick="openApp()">
            Open App Manually
        </button>

        <div class="config-info">
            <strong>⚙️ Configuration Note:</strong>
            Update the universal link in config.js to match your Android app's deep link URL.
        </div>
    </div>

    <script src="config.js"></script>
    <script src="timer.js"></script>
</body>
</html>
